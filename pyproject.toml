[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entrykit"
version = "0.1.0"
description = "Supporting CLI for make-frederica skill capture and Notion workflows."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = []
authors = [
  {name = "bxu"},
]
keywords = ["notion", "cli", "knowledge-base", "llm", "automation"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Intended Audience :: Developers",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
dev = []

[project.urls]
Repository = "https://github.com/forestsheep911/make-frederica"
Issues = "https://github.com/forestsheep911/make-frederica/issues"

[project.scripts]
entrykit = "entrykit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
